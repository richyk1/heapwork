[package]
name = "host"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "heapwork"
path = "src/main.rs"

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
libc = "0.2"
